<div id="info_modal" class="modal-tos">
    <article class="form tos-container">
        <header>
            <span class="tos-close-btn">X</span>
            <h2 class="tos-title game-title">{{title}}</h2>
        </header>
        <section>
            <p class="tos-p game-text">
                {{message}}
            </p>
            {% if winner %}
                <div class="tos-btn-container">
                    <a href="https://wa.me/595995366622?text=Hola%21%20soy%20uno%20de%20los%20ganadores%20del%20premio%20del%20evento%20UnaePlay%2E%20. Logre%20posicionarme%20entre%20los%203%20primeros%20del%20ranking%20global%20y%20quiero%20reclamar%20mi%20premio" 
                    target="_blank" rel="noopener noreferrer">
                        <svg xmlns="http://www.w3.org/2000/svg" 
                            width="24" height="24" viewBox="0 0 24 24" fill="none" 
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" 
                            stroke-linejoin="round" class="icon icon-tabler icons-tabler-outline icon-tabler-brand-whatsapp">
                            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                            <path d="M3 21l1.65 -3.8a9 9 0 1 1 3.4 2.9l-5.05 .9" />
                            <path d="M9 10a.5 .5 0 0 0 1 0v-1a.5 .5 0 0 0 -1 0v1a5 5 0 0 0 5 5h1a.5 .5 0 0 0 0 -1h-1a.5 .5 0 0 0 0 1" />
                        </svg>
                    </a>
                </div>
            {% endif %}
        </section>
        <footer class="tos-btn-container">
            <button class="form-submit tos-btn game-text" type="button">Acerptar</button>
        </footer>
    </article>
</div>

{% load static %}
<style>
  /* Scoped styles for prizes only */
  .prizes-section {
    padding: 60px 20px;
    text-align: center;
    background: transparent;
  }
  .prizes-title {
    font-size: 2.2rem;
    text-transform: uppercase;
    margin-bottom: 12px;
    background: linear-gradient(to right, #e100ff, #ff007f);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .prizes-subtitle {
    color: #cfcfcf;
    font-size: 0.95rem;
    margin-bottom: 28px;
  }
  .prizes-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 28px;
  }
  .prize-card {
    background: rgba(255, 255, 255, 0.05);
    border-radius: 16px;
    padding: 22px 18px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    transition: transform .25s ease, box-shadow .25s ease;
  }
  .prize-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 10px 30px rgba(225, 0, 255, 0.35);
  }
  .prize-icon {
    width: 88px;
    height: 88px;
    border-radius: 18px;
    display: grid;
    place-items: center;
    font-size: 46px;
    margin-bottom: 14px;
    background: radial-gradient(circle at 30% 30%, rgba(255,255,255,.25), rgba(255,255,255,.05) 60%),
                linear-gradient(135deg, rgba(225,0,255,.25), rgba(255,0,127,.2));
    border: 1px solid rgba(225,0,255,.25);
    box-shadow: inset 0 1px 6px rgba(255,255,255,.08);
  }
  .prize-name {
    font-weight: 700;
    color: #ffffff;
    margin: 6px 0 6px;
  }
  .prize-desc {
    font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
    color: #d8d8d8;
    font-size: 1.1rem;
  }
  /* Color accents per position */
  .gold .prize-icon { border-color: #f5ec00aa; background: linear-gradient(135deg, #f5ec0099, #ffffff22); }
  .silver .prize-icon { border-color: #c0c0c0aa; background: linear-gradient(135deg, #c0c0c099, #ffffff22); }
  .bronze .prize-icon { border-color: #a96800aa; background: linear-gradient(135deg, #a9680099, #ffffff22); }
</style>

<section class="prizes-section" aria-labelledby="prizes-title">
  <h2 id="prizes-title" class="prizes-title">Premios</h2>
  <p class="prizes-subtitle">Participá y podés llevarte estos premios.</p>

  <div class="prizes-grid">
    <article class="prize-card gold" aria-label="Primer premio: Control de PS4">
      <div class="prize-icon" aria-hidden="true">🎮</div>
      <h3 class="prize-name">1º Premio</h3>
      <p class="prize-desc">Un control de PS4</p>
    </article>

    <article class="prize-card silver" aria-label="Segundo premio: Auriculares Bluetooth Xiaomi">
      <div class="prize-icon" aria-hidden="true">🎧</div>
      <h3 class="prize-name">2º Premio</h3>
      <p class="prize-desc">Auriculares Xiaomi Bluetooth</p>
    </article>

    <article class="prize-card bronze" aria-label="Tercer premio: Game box portátil">
      <div class="prize-icon" aria-hidden="true">🕹️</div>
      <h3 class="prize-name">3º Premio</h3>
      <p class="prize-desc">Game box portátil</p>
    </article>
  </div>
</section>

<div id="rankingModal" class="modal">
    <div class="modal-content">
      <button class="close-btn">&times</button>

      <div class="select-container">
        <input type="hidden" id="aux-input">
        <label for="rankingFilter" class="label">Filtrar ranking:</label>
        <select id="rankingFilter" class="select game-text">
          <option value="score" class="option">Tu puntaje</option>
          <option id="game" value="game" class="option"></option>
          <option value="global" class="option">Top Global</option>
        </select>
      </div>
      

      <!--Puntaje del jugador y palabra en los juegos wordle y ahorcado-->
      <section class="score-screen">
        <!--Aqui se muestra un icono dependiendo del resultado-->
        <div class="score-icon game-score-icon"><i class="fa-solid fa-crown fa-bounce" style="color: #edca1d;"></i></div>
        <!--Aqui va mensaje dependiendo del resultado-->
        <h2 class="score-title game-title">Partida finalizada</h2>
        <!--Aqui va la palabra (solo en wordle y ahorcado)-->
        <h3 class="word-title game-text" style="display: none;">Palabra correcta:</h3>
        <p class="word game-title" style="display: none;">None</p>
        <!--Puntaje del jugador en la partida terminada-->
        <p class="player-score game-text">Tu puntaje: </p>

      </section>
      <section class="ranking-table game-text" style="display: none;">
        <!--Se utiliza la misma tabla para mostrar el ranking-->
        <table id="rankingTable">
          <thead>
            <tr>
              <th>Posición</th>
              <th>Jugador</th>
              <th>Puntaje</th>
            </tr>
          </thead>
          <tbody>
            <!-- Datos estáticos de ejemplo -->
            <tr>
              <td><i class="fa-solid fa-1 fa-beat" style="color: #ffd43b;"></i></td>
              <td id="player-1"></td>
              <td id="score-1"></td>
            </tr>
            <tr>
              <td><i class="fa-solid fa-2" style="color: #d3d2cf;"></i></td>
              <td id="player-2"></td>
              <td id="score-2"></td>
            </tr>
            <tr>
              <td><i class="fa-solid fa-3" style="color: #e8c3ab;"></i></td>
              <td id="player-3"></td>
              <td id="score-3"></td>
            </tr>
            <tr>
              <td>4</td>
              <td id="player-4"></td>
              <td id="score-4"></td>
            </tr>
            <tr>
              <td>5</td>
              <td id="player-5"></td>
              <td id="score-5"></td>
            </tr>
            <tr>
              <td>6</td>
              <td id="player-6"></td>
              <td id="score-6"></td>
            </tr>
            <tr>
              <td>7</td>
              <td id="player-7"></td>
              <td id="score-7"></td>
            </tr>
            <tr>
              <td>8</td>
              <td id="player-8"></td>
              <td id="score-8"></td>
            </tr>
            <tr>
              <td>9</td>
              <td id="player-9"></td>
              <td id="score-9"></td>
            </tr>
            <tr>
              <td>10</td>
              <td id="player-10"></td>
              <td id="score-10"></td>
            </tr>
          </tbody>
        </table>
      </section>

    </div>
  </div>

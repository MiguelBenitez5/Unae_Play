<div class="modal-tos" style="display: none;">
    <div class="tos-content">
        {% include 'accounts/terms-of-service.html' %}
    </div>
</div>

<form class="form" action="" method="POST">
    {% csrf_token %}
    <h2 class="form-title game-title">Registrate</h2>
    <label class="form-label" for="username">Nombre de usuario (maximo 10 caracteres)</label>
    <input class="form-input" name="username" id="username" type="text" maxlength="10" required placeholder="Ej: Marcos360">
    <label class="form-label" for="email">Correo electronico</label>
    <input class="form-input" name="email" id="email" type="email" required placeholder="ejemplo@gmail.com">
    <label class="form-label" for="password">Contraseña</label>
    <input class="form-input" name="password" id="password" type="password" required>
    <label class="form-label" for="age">Edad</label>
    <input class="form-input" type="number" name="age" id="age" required>
    <div class="terms">
        <input class="form-checkbox" type="checkbox" id="checkbox" name="checkbox" value="1">
        <p class="form-text">Acepto los <a href="#" class="form-link">terminos y condiciones</a></p>
    </div>
    <div class="submit-btn-container">
        <button class="form-submit" type="submit">Registrarse</button>
    </div>
    <div class="form-footer">
        <p class="form-text">Ya tienes una cuenta?</p>
        <p><a href="/accounts/login" class="form-link">Inicia sesion</a></p>
    </div>
</form>
